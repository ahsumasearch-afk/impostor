<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fragen-Impostor ist umgezogen</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://ahsumasearch-afk.github.io/spielraum/impostor/">
<!-- Ohne JavaScript greift diese Zeile. Sie kann den Raum-Code allerdings
     nicht mitnehmen – deshalb steht unten zusaetzlich ein Link. -->
<meta http-equiv="refresh" content="3;url=https://ahsumasearch-afk.github.io/spielraum/impostor/">
<script>
  /* Sofort weiterleiten und dabei den Einladungslink vollstaendig mitnehmen:
     aus .../impostor/?r=ABCD wird .../spielraum/impostor/?r=ABCD.
     replace() statt href, damit der Zurueck-Knopf nicht in einer Schleife landet. */
  (function(){
    var ziel="https://ahsumasearch-afk.github.io/spielraum/impostor/"
             + location.search + location.hash;
    location.replace(ziel);
  })();
</script>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:#0a0b12;color:#e8eaf2;
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:24px;text-align:center}
  .karte{max-width:440px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:32px 26px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#a9b0c7;margin:0 0 20px}
  a.knopf{display:inline-block;padding:14px 22px;border-radius:13px;
    background:linear-gradient(135deg,#8b5cf6,#38bdf8);color:#fff;
    text-decoration:none;font-weight:700}
  small{display:block;margin-top:16px;color:#6d748c;font-size:13px}
</style>
</head>
<body>
  <div class="karte">
    <h1>Fragen-Impostor ist umgezogen</h1>
    <p>Das Spiel liegt jetzt im Spielraum, zusammen mit Mind-Match und Wavelength.
       Du wirst gleich weitergeleitet.</p>
    <a class="knopf" id="weiter" href="https://ahsumasearch-afk.github.io/spielraum/impostor/">
      Zum Spiel →
    </a>
    <small>Diese Adresse bleibt bestehen – alte Einladungslinks funktionieren weiter.</small>
  </div>
  <script>
    /* Auch der Knopf nimmt den Raum-Code mit, falls die Weiterleitung
       blockiert wurde. */
    document.getElementById("weiter").href =
      "https://ahsumasearch-afk.github.io/spielraum/impostor/" + location.search + location.hash;
  </script>
</body>
</html>
