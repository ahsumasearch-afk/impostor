<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fragen-Impostor</title>
<meta name="description" content="Party-Spiel ab 3 Spielern: Alle beantworten dieselbe Frage – einer nicht. Findet den Lügner.">
<meta name="theme-color" content="#0a0b12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0b12;
  --glass:rgba(255,255,255,.045);
  --glass2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.18);
  --tx:#f2f4fa;
  --mut:#9aa3bd;
  --v:#8b5cf6; --c:#22d3ee; --p:#f472b6; --o:#fb923c;
  --ok:#34d399; --bad:#fb7185;
  --grad:linear-gradient(120deg,#8b5cf6,#6366f1 45%,#22d3ee);
  --r:20px;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--tx);
  font:16px/1.55 "Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;padding:22px 16px calc(40px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative
}
body::before,body::after{
  content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none
}
body::before{width:70vw;height:70vw;max-width:620px;max-height:620px;background:#6d28d9;top:-22vw;left:-18vw;animation:drift1 26s ease-in-out infinite alternate}
body::after{width:60vw;height:60vw;max-width:520px;max-height:520px;background:#0e7490;top:26vh;right:-22vw;animation:drift2 31s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vw,-12vh) scale(1.1)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}

#app{max-width:100%;margin:0 auto;position:relative}
.solo{max-width:540px;margin:0 auto}
.wrap{display:grid;gap:0}

/* Spielerliste: auf dem Handy ein Panel, das von rechts hereinfaehrt */
.colA{position:fixed;top:0;right:0;bottom:0;width:min(86vw,350px);z-index:60;
  background:#0d0f17;border-left:1px solid var(--line);padding:16px 15px;overflow-y:auto;
  transform:translateX(102%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  box-shadow:-24px 0 60px rgba(0,0,0,.55)}
body.pl-open .colA{transform:none}
.scrim{position:fixed;inset:0;background:rgba(4,5,10,.62);z-index:55;opacity:0;
  pointer-events:none;transition:opacity .26s}
body.pl-open .scrim{opacity:1;pointer-events:auto}
.closex{display:block;width:auto;margin:0 0 12px auto;padding:9px 15px;font-size:14px;
  border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  box-shadow:none;color:var(--mut)}
.only-mobile{display:inline-flex}
.chat-log{max-height:46vh}

@media(min-width:900px){
  body{padding:20px 20px 30px}
  /* Drei Spalten. Die Seite scrollt ganz normal – nur die beiden Randspalten
     bleiben beim Scrollen stehen. Kein overflow:hidden auf dem body! */
  .wrap{grid-template-columns:230px minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .main{grid-column:2;grid-row:1;min-width:0}
  .colA{grid-column:1;grid-row:1;position:sticky;top:20px;inset:auto;transform:none;width:auto;
    background:none;border:0;padding:0;box-shadow:none;overflow:visible;z-index:1;
    max-height:calc(100dvh - 40px);overflow-y:auto}
  .colB{grid-column:3;grid-row:1;min-width:0;position:sticky;top:20px}
  .scrim,.closex,.only-mobile,.chip.only-mobile{display:none}
  /* Chat nutzt die Bildschirmhoehe, bleibt aber vollstaendig sichtbar. */
  .colB .chatfull{display:flex;flex-direction:column;margin-bottom:0;
    height:clamp(380px,calc(100dvh - 150px),780px)}
  .colB .chatfull .chat-log{max-height:none;flex:1;min-height:0}
  .colA::-webkit-scrollbar,.chat-log::-webkit-scrollbar{width:8px}
  .colA::-webkit-scrollbar-thumb,.chat-log::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.13);border-radius:99px}
  .q{font-size:24px}
  .qhero .q{font-size:40px}
  .code-hero .val{font-size:58px}
}
.rise{animation:rise .34s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.rise{animation:none}}

.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.mark{width:38px;height:38px;border-radius:12px;background:var(--grad);flex:none;
  display:grid;place-items:center;font-size:19px;box-shadow:0 6px 22px rgba(139,92,246,.42)}
h1{font-size:25px;font-weight:800;letter-spacing:-.7px;line-height:1.1}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:12px}
.sub{color:var(--mut);font-size:14.5px;margin-bottom:20px}

.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.tight{padding:14px 16px}
.card.glow{background:linear-gradient(150deg,rgba(139,92,246,.20),rgba(34,211,238,.10));border-color:rgba(139,92,246,.42)}
.card.bad{background:rgba(251,113,133,.10);border-color:rgba(251,113,133,.35)}
.card.win{background:linear-gradient(150deg,rgba(52,211,153,.24),rgba(52,211,153,.06));border-color:rgba(52,211,153,.5)}
.card.lose{background:linear-gradient(150deg,rgba(251,113,133,.24),rgba(251,113,133,.06));border-color:rgba(251,113,133,.5)}
.verdict{font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;margin-bottom:5px}
.verdict.g{color:#34d399}
.verdict.r{color:#fb7185}
.vsub{font-size:15px;font-weight:500;color:var(--tx);opacity:.85}
.qpair{display:grid;gap:10px;margin-top:2px}
.qbox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.qbox .k{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.qbox .v{font-size:16.5px;font-weight:600;line-height:1.35}
.qbox.imp{border-color:rgba(251,113,133,.42);background:rgba(251,113,133,.10)}
.qbox.imp .k{color:#fda4af}

label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:7px;letter-spacing:.2px}
input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx);
  border-radius:13px;padding:14px;font:500 16px "Outfit",system-ui,sans-serif;outline:none;transition:.18s}
input::placeholder{color:#6b7490}
input:focus{border-color:rgba(139,92,246,.75);background:rgba(139,92,246,.08);box-shadow:0 0 0 4px rgba(139,92,246,.13)}
input.code{text-transform:uppercase;letter-spacing:9px;font-weight:800;text-align:center;font-size:23px;padding-left:9px}

button{width:100%;border:0;border-radius:13px;padding:15px;cursor:pointer;transition:.18s;
  font:600 16px "Outfit",system-ui,sans-serif;color:#fff;background:var(--grad);
  box-shadow:0 8px 24px rgba(99,102,241,.32);margin-top:11px}
button:active:not(:disabled){transform:scale(.978)}
button:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
button.sec{background:rgba(255,255,255,.06);border:1px solid var(--line2);box-shadow:none;color:var(--tx)}
button.sec:hover:not(:disabled){background:rgba(255,255,255,.11)}
button.mini{width:auto;padding:7px 13px;font-size:13px;font-weight:600;margin:0;border-radius:9px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none;color:var(--mut)}
button.mini:hover:not(:disabled){color:#fff;background:rgba(251,113,133,.2);border-color:rgba(251,113,133,.45)}
button.pick{background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:none;color:var(--tx);
  text-align:left;display:flex;align-items:center;gap:12px;margin-top:9px;padding:13px 14px}
button.pick:hover:not(:disabled){border-color:rgba(139,92,246,.6);background:rgba(139,92,246,.12)}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mut);
  background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.chip b{color:var(--tx);letter-spacing:1.5px}
.chip.act{color:#fff;background:rgba(139,92,246,.22);border-color:rgba(139,92,246,.5)}
.chip.btn{cursor:pointer}
.chip.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--tx)}
.chip.clock.hot{background:rgba(251,113,133,.24);border-color:rgba(251,113,133,.55);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.chip.clock.hot{animation:none}}
.bigclock{font-size:40px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.bigclock.hot{color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:2px}
.seg button{margin:0;padding:11px 3px;font-size:14px;font-weight:600;border-radius:11px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:none;color:var(--mut)}
.seg button.on{background:var(--grad);color:#fff;border-color:transparent}
.chip.danger{background:rgba(251,113,133,.18);border-color:rgba(251,113,133,.5);color:#fda4af;font-weight:700}
.chip.danger:hover{background:rgba(251,113,133,.32);color:#fff}
.chip .bdg{background:var(--p);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}

.steps{display:flex;gap:6px;margin-bottom:18px}
.step{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.step.on{background:var(--grad)}

.code-hero{text-align:center;padding:24px 18px}
.code-hero .lbl{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.code-hero .val{font-size:52px;font-weight:800;letter-spacing:12px;line-height:1.25;padding-left:12px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Die grosse Fragenkarte. ACHTUNG: Sie sieht fuer JEDEN gleich aus –
   der Impostor darf an nichts erkennen, dass er eine andere Frage hat. */
.qhero{padding:30px 24px 32px;border-radius:24px;
  background:linear-gradient(155deg,rgba(139,92,246,.30),rgba(34,211,238,.13));
  border:1px solid rgba(139,92,246,.55);
  box-shadow:0 20px 60px rgba(99,102,241,.24),inset 0 1px 0 rgba(255,255,255,.08)}
.qhero .qlbl{font-size:12px;letter-spacing:2.6px;margin-bottom:12px;color:#ddd6fe}
.qhero .q{font-size:30px;line-height:1.2;letter-spacing:-.9px;font-weight:800}
@media(min-width:520px){.qhero .q{font-size:34px}}
.qlbl{font-size:11.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#c4b5fd;margin-bottom:9px}
.q{font-size:22px;font-weight:700;line-height:1.32;letter-spacing:-.4px}

.plist{list-style:none}
.plist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.plist li:last-child{border:0}.plist li:first-child{padding-top:2px}
.av{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-weight:700;font-size:15px;color:#0a0b12}
.av.off{filter:grayscale(1);opacity:.4}
.nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;font-size:12px;font-weight:500;color:var(--mut);letter-spacing:.1px}
.pts{font-size:13px;font-weight:600;color:var(--mut);flex:none}
.pts.ok{color:var(--ok)}
.pts.off{color:#727b93}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px;
  vertical-align:1px;letter-spacing:.3px}
.tag.you{background:rgba(255,255,255,.1);color:var(--mut)}
.tag.host{background:rgba(139,92,246,.25);color:#c4b5fd}
.tag.imp{background:var(--bad);color:#3b0a14}
.tag.win{background:var(--ok);color:#04291d}

.ans{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:12px;align-items:flex-start}
.ans:last-child{border:0}.ans:first-child{padding-top:2px}
.ans .who{font-size:12.5px;color:var(--mut);font-weight:600}
.ans .txt{font-size:17px;font-weight:600;line-height:1.35;word-break:break-word}

.chat-log{max-height:250px;overflow-y:auto;overscroll-behavior:contain;margin-bottom:12px;
  display:flex;flex-direction:column;gap:9px;padding-right:2px}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg .av{width:27px;height:27px;border-radius:9px;font-size:12px}
.msg .bub{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);
  border-radius:4px 13px 13px 13px;padding:7px 11px;max-width:82%}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:rgba(139,92,246,.19);border-color:rgba(139,92,246,.3);border-radius:13px 4px 13px 13px}
.msg .au{font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:1px}
.msg .tx{font-size:14.5px;word-break:break-word;line-height:1.4}
.chat-empty{color:var(--mut);font-size:14px;text-align:center;padding:14px 0}
.chat-in{display:flex;gap:8px}
.chat-in input{flex:1;padding:12px 14px;font-size:15px}
.chat-in button{width:52px;flex:none;margin:0;padding:0;font-size:17px;border-radius:13px}

.note{color:var(--mut);font-size:13.5px;margin-top:11px;line-height:1.5}
.hint{color:#c4b5fd;font-size:13.5px;margin-top:11px}
.center{text-align:center}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:8px 0 3px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.16);
  border-top-color:#a78bfa;border-radius:50%;animation:sp .75s linear infinite;vertical-align:-2px;margin-right:9px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{color:#5b6480;font-size:12px;text-align:center;margin-top:24px;line-height:1.6}
.bar{height:1px;background:rgba(255,255,255,.08);margin:15px 0}
.warn{position:fixed;left:0;right:0;top:0;background:linear-gradient(90deg,#f59e0b,#f472b6);
  color:#26120a;font-size:13.5px;font-weight:700;text-align:center;padding:9px 14px;z-index:99}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ============================ Fragenpaare ============================ */
const PAIRS=[
["Wie viele Stunden hast du letzte Nacht geschlafen?","Wie viele Tassen Kaffee trinkst du am Tag?"],
["Wie viel Geld gibst du pro Woche für Essen aus?","Wie viel kostet dein Handyvertrag im Monat?"],
["Welches Tier wärst du gern?","Welches Tier würdest du niemals anfassen?"],
["Was ist dein Lieblings-Urlaubsland?","In welchem Land würdest du nie leben wollen?"],
["Wie oft machst du pro Woche Sport?","Wie oft bestellst du pro Woche Essen?"],
["Was ist dein Lieblingsgetränk?","Was trinkst du, wenn du krank bist?"],
["Welche App nutzt du am meisten?","Welche App würdest du sofort löschen?"],
["Wie alt warst du bei deinem ersten Kuss?","Wie alt warst du, als du zum ersten Mal allein verreist bist?"],
["Nenne eine Farbe, die dir gut steht.","Nenne eine Farbe, die du hässlich findest."],
["Was ist dein Lieblingsfilm?","Welchen Film hast du am häufigsten gesehen?"],
["Was würdest du mit 1000 € sofort machen?","Wofür gibst du eindeutig zu viel Geld aus?"],
["Wie lange brauchst du morgens im Bad?","Wie lange brauchst du zur Arbeit?"],
["Nenne eine Stadt, die du liebst.","Nenne eine Stadt, die überbewertet ist."],
["Was isst du am liebsten zum Frühstück?","Was isst du nachts, wenn du Hunger bekommst?"],
["Welchen Beruf wolltest du als Kind?","Welchen Beruf könntest du niemals machen?"],
["Wie viele Menschen wohnen in deinem Haushalt?","Wie viele richtig enge Freunde hast du?"],
["Was ist dein größtes Talent?","Worin bist du überraschend schlecht?"],
["Welche Musikrichtung hörst du am liebsten?","Welche Musik läuft bei dir im Auto?"],
["Wie viele Paar Schuhe besitzt du?","Wie viele Jacken hängen bei dir im Flur?"],
["Was nervt dich im Straßenverkehr am meisten?","Was nervt dich an deinen Nachbarn?"],
["Welches Schulfach mochtest du am liebsten?","In welchem Schulfach warst du am schlechtesten?"],
["Was ist dein Lieblingsfeiertag?","Welchen Feiertag findest du überflüssig?"],
["Wann gehst du normalerweise ins Bett?","Wann stehst du am Wochenende auf?"],
["Nenne etwas, das immer in deinem Kühlschrank ist.","Nenne etwas, das du nie kaufen würdest."],
["Was bestellst du an der Bar?","Was trinkst du, wenn du am nächsten Tag früh raus musst?"],
["Was war dein letzter Online-Kauf?","Was liegt gerade in deinem Warenkorb?"],
["Wie viele Kilometer fährst du am Tag?","Wie viele Schritte machst du am Tag?"],
["Welche Serie schaust du gerade?","Welche Serie hast du abgebrochen?"],
["Was ist deine größte Angst?","Wovor hattest du als Kind Angst?"],
["Nenne ein Wort, das du viel zu oft benutzt.","Nenne ein Wort, das du nicht leiden kannst."],
["Welches Körperteil tut dir gerade weh?","Welches Körperteil magst du an dir am liebsten?"],
["Was nimmst du auf eine einsame Insel mit?","Was hast du immer in der Tasche?"],
["Wie viel Prozent Akku hat dein Handy gerade?","Wie viel Prozent deines Geldes sparst du?"],
["Welche Pizza bestellst du?","Welchen Belag magst du überhaupt nicht?"],
["Wo war dein letzter Urlaub?","Wo möchtest du unbedingt mal hin?"],
["Was ist dein Lieblingsplatz zuhause?","Wo im Haus bist du am seltensten?"],
["Nenne einen Promi, den du treffen möchtest.","Nenne einen Promi, den du nicht ausstehen kannst."],
["Wie lange hältst du es ohne Handy aus?","Wie lange hältst du es aus, ohne zu reden?"],
["Was kochst du, wenn Besuch kommt?","Was kochst du, wenn du keine Lust hast?"],
["Welches Wetter magst du am liebsten?","Bei welchem Wetter bleibst du lieber zuhause?"]
];

/* ============================ Basics ============================ */
const ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", PREFIX="fragimp-";
const MAXAGE=6*3600*1000;
const app=document.getElementById("app");
const el=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const genCode=()=>Array.from({length:4},()=>ALPHA[(Math.random()*ALPHA.length)|0]).join("");
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const LS={
  get(k,d){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(_){return d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(_){} },
  del(k){ try{localStorage.removeItem(k);}catch(_){} },
  /* Nur loeschen, was diesem Tab gehoert – mehrere Tabs teilen sich den Speicher. */
  delMine(k){ const o=this.get(k,null); if(o&&o.owner&&o.owner!==myPid) return; this.del(k); }
};
function hue(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }
function avatar(p,cls){
  const h=hue(p.pid||p.name||"x");
  const off=(p.online===false)?" off":"";
  return `<span class="av${off}${cls?" "+cls:""}" style="background:linear-gradient(140deg,hsl(${h} 82% 68%),hsl(${(h+42)%360} 82% 58%))">${esc((p.name||"?").trim().charAt(0).toUpperCase())}</span>`;
}

/* Eigene Identität. Überlebt Neuladen (sessionStorage bleibt im Tab bestehen),
   ist aber pro Tab eigen – so kann man auf einem Rechner zu dritt testen.
   Ein frisch geöffneter Tab übernimmt die gespeicherte Identität nur dann,
   wenn sie gerade kein anderer Tab benutzt (Heartbeat). */
const SS={
  get(k){ try{return sessionStorage.getItem(k);}catch(_){return null;} },
  set(k,v){ try{sessionStorage.setItem(k,v);}catch(_){} }
};
let myPid=SS.get("fi_pid");
if(!myPid){
  const base=LS.get("fi_pid",null), claim=LS.get("fi_pid_claim",0);
  if(base&&Date.now()-claim>8000){ myPid=base; }
  else { myPid=uid(); if(!base) LS.set("fi_pid",myPid); }
  SS.set("fi_pid",myPid);
}
if(myPid===LS.get("fi_pid",null)) LS.set("fi_pid_claim",Date.now());
setInterval(()=>{ if(myPid===LS.get("fi_pid",null)) LS.set("fi_pid_claim",Date.now()); },3000);

/* ============================ Zustand ============================ */
let peer=null,isHost=false,roomCode="",myName="";
let conns={};            // Host: connId -> DataConnection
let hostConn=null;       // Client: Verbindung zum Host
let S=null;              // öffentlich sichtbarer Zustand
let H=null;              // Host: vollständiger Zustand
let myQuestion="";
let screen="start";      // start | invite | connecting | game | error | kicked
let errMsg="",banner="";
let draftAnswer="",draftChat="",chatOpen=LS.get("fi_chatopen",true),chatSeen=0,refocus=null;
let retryTimer=null,retries=0;

const url=new URL(location.href);
const rawInvite=(url.searchParams.get("r")||"").toUpperCase();
let inviteCode=/^[A-Z0-9]{4}$/.test(rawInvite)?rawInvite:"";

/* ============================ Host-Logik ============================ */
function freshState(){
  return {phase:"lobby",round:0,players:[],mainQuestion:"",impostorId:null,
          tally:{},topIds:[],caught:false,chat:[],kicked:[],
          tAnswer:0,tTalk:0,tVote:0,deadline:0};
}
const GRACE=18000;   // Reserve fuer stille Faelle
const QUICK=4000;    // abgemeldet oder Herzschlag ausgeblieben: nur kurz auf Rueckkehr warten
const BEAT=2500;     // so oft meldet sich jeder Spieler beim Host
const DEAD=6500;     // so lange Stille, dann gilt jemand als weg
const HOSTDEAD=14000;// so lange Stille vom Host, dann versucht der Client neu zu verbinden
const hp=pid=>H.players.find(p=>p.pid===pid);
const active=()=>H.players.filter(p=>p.online&&!p.waiting);
const inRound=()=>H.players.filter(p=>!p.waiting);
/* Wer die Runde blockiert: alle Mitspieler, die online sind oder gerade erst
   weggefallen sind (z.B. weil sie neu laden). Wer laenger weg ist, wird uebergangen. */
const blockers=()=>inRound().filter(p=>p.online||Date.now()-(p.offSince||0)<(p.quick?QUICK:GRACE));
let graceTimer=null;
function armGrace(ms){
  clearTimeout(graceTimer);
  graceTimer=setTimeout(()=>{ if(!H) return; checkAnswers(); checkVotes(); broadcast(); },ms);
}

function saveHost(){
  if(!H||!roomCode) return;
  LS.set("fi_host",{code:roomCode,ts:Date.now(),owner:myPid,
    state:{...H,players:H.players.map(p=>({...p,connId:null,online:false}))}});
}
function sendTo(p,msg){ const c=p.connId&&conns[p.connId]; if(c&&c.open){ try{c.send(msg);}catch(_){} } }

function hostJoin(connId,pid,name){
  if(H.kicked.includes(pid)){
    const c=conns[connId]; if(c&&c.open) c.send({t:"denied"});
    return;
  }
  let p=hp(pid);
  if(p){                                   // Wiederkehrer: alles bleibt erhalten
    p.connId=connId; p.online=true; p.offSince=0; p.quick=false; p.lastSeen=Date.now();
    if(name) p.name=uniqueName(name,pid);
  }else{
    p={pid,name:uniqueName(name||"Spieler",pid),score:0,answer:null,vote:null,question:"",
       online:true,connId,lastSeen:Date.now(),waiting:H.phase!=="lobby"};
    H.players.push(p);
  }
  broadcast();
}
function uniqueName(n,pid){
  n=String(n).trim().slice(0,16)||"Spieler";
  const taken=H.players.filter(p=>p.pid!==pid).map(p=>p.name.toLowerCase());
  if(!taken.includes(n.toLowerCase())) return n;
  for(let i=2;i<40;i++) if(!taken.includes((n+" "+i).toLowerCase())) return n+" "+i;
  return n;
}
function hostOffline(connId){
  const p=H.players.find(x=>x.connId===connId);
  delete conns[connId];
  if(!p) return;
  // Wer sich abgemeldet hat (Tab geschlossen/neu geladen), haelt die Runde nur kurz auf.
  const saidBye=p.quick&&Date.now()-(p.offSince||0)<3000;
  p.online=false; p.connId=null;                 // NICHT entfernen – Punkte bleiben erhalten
  if(!saidBye){ p.quick=false; p.offSince=Date.now(); }
  armGrace(saidBye?QUICK+400:GRACE+500); broadcast();
}
function hostKick(pid){
  const p=hp(pid); if(!p||pid===myPid) return;
  H.kicked.push(pid);
  sendTo(p,{t:"kick"});
  const c=p.connId&&conns[p.connId];
  H.players=H.players.filter(x=>x.pid!==pid);
  setTimeout(()=>{ try{c&&c.close();}catch(_){} },300);
  checkAnswers(); checkVotes(); broadcast();
}
function hostStartRound(){
  const act=H.players.filter(p=>p.online);
  if(act.length<3) return;
  const pair=PAIRS[(Math.random()*PAIRS.length)|0], flip=Math.random()<.5;
  const main=flip?pair[1]:pair[0], other=flip?pair[0]:pair[1];
  const imp=act[(Math.random()*act.length)|0];
  H.round++; H.phase="answer"; H.mainQuestion=main; H.impostorId=imp.pid;
  setDeadline("answer");
  H.tally={}; H.topIds=[]; H.caught=false;
  clearTimeout(graceTimer);
  H.players.forEach(p=>{ p.answer=null; p.vote=null;
    p.waiting=!p.online;                       // wer gerade weg ist, sitzt die Runde aus
    p.question=(p.pid===imp.pid)?other:main; });
  broadcast();
}
/* Setzt die Uhr fuer die neue Phase – 0 heisst: ohne Zeitlimit. */
function setDeadline(phase){
  const sec=phase==="answer"?H.tAnswer:phase==="reveal"?H.tTalk:phase==="vote"?H.tVote:0;
  H.deadline=sec?Date.now()+sec*1000:0;
}
function checkAnswers(force){
  if(H.phase!=="answer") return;
  const b=force?active():blockers();
  if(b.length>=2&&b.every(p=>p.answer!=null)){ H.phase="reveal"; setDeadline("reveal"); }
}
function checkVotes(force){
  if(H.phase!=="vote") return;
  const b=force?active():blockers();
  if(!(b.length>=2&&b.every(p=>p.vote!=null))) return;
  finishVotes();
}
/* Teamwertung: Entweder gewinnt die Gruppe gemeinsam oder der Luegner allein.
   Der einzelne richtige Tipp bringt nichts, wenn die Mehrheit danebenliegt. */
function finishVotes(){
  const voters=inRound().filter(p=>p.vote!=null);
  const t={}; voters.forEach(p=>{ t[p.vote]=(t[p.vote]||0)+1; });
  const werte=Object.values(t);
  const max=werte.length?Math.max(...werte):0;
  const tops=Object.keys(t).filter(k=>t[k]===max);
  H.tally=t; H.topIds=tops;
  H.caught=tops.length===1&&tops[0]===H.impostorId;
  if(H.caught) inRound().forEach(p=>{ if(p.pid!==H.impostorId) p.score+=1; });
  else { const i=hp(H.impostorId); if(i) i.score+=1; }
  H.phase="result"; H.deadline=0;
}
function hostChat(pid,text){
  const p=hp(pid); if(!p) return;
  text=String(text||"").trim().slice(0,300); if(!text) return;
  H.chat.push({id:uid(),pid,name:p.name,text,ts:Date.now()});
  if(H.chat.length>120) H.chat=H.chat.slice(-120);
  broadcast();
}
/* Der Host prueft regelmaessig, wer sich nicht mehr meldet – auf das close-Ereignis
   von WebRTC ist kein Verlass, wenn jemand einfach den Tab zumacht. */
let sweepTimer=null,beatCount=0;
function hostSweep(){
  if(!H) return;
  let changed=false;
  H.players.forEach(p=>{
    if(p.pid===myPid){ p.online=true; p.lastSeen=Date.now(); return; }
    if(p.online&&Date.now()-(p.lastSeen||0)>DEAD){
      p.online=false; p.quick=true; p.offSince=Date.now(); changed=true;
    }
  });
  if(H.deadline&&Date.now()>H.deadline){                      // Zeit ist um
    if(H.phase==="answer"){ H.phase="reveal"; setDeadline("reveal"); broadcast(); return; }
    if(H.phase==="reveal"){ H.phase="vote";   setDeadline("vote");   broadcast(); return; }
    if(H.phase==="vote"){   finishVotes();                            broadcast(); return; }
    H.deadline=0;
  }
  const before=H.phase;
  checkAnswers(); checkVotes();
  if(changed||H.phase!==before){ broadcast(); return; }
  if(++beatCount%3===0) Object.values(conns).forEach(c=>{ if(c.open){ try{c.send({t:"hb"});}catch(_){} } });
}
function publicState(){
  const show=H.phase==="reveal"||H.phase==="vote"||H.phase==="result";
  return {
    phase:H.phase,round:H.round,code:roomCode,hostId:myPid,
    mainQuestion:H.phase==="answer"?"":H.mainQuestion,
    impostorId:H.phase==="result"?H.impostorId:null,
    impostorQuestion:H.phase==="result"?((hp(H.impostorId)||{}).question||""):"",
    tally:H.tally,topIds:H.topIds,caught:H.caught,chat:H.chat,
    tAnswer:H.tAnswer||0, tTalk:H.tTalk||0, tVote:H.tVote||0, deadline:H.deadline||0,
    players:H.players.map(p=>({
      pid:p.pid,name:p.name,score:p.score,online:p.online,waiting:!!p.waiting,
      answered:p.answer!=null,voted:p.vote!=null,
      answer:show?p.answer:null,vote:H.phase==="result"?p.vote:null
    }))
  };
}
function broadcast(){
  const s=publicState();
  H.players.forEach(p=>{
    if(p.pid===myPid){ S=s; myQuestion=p.question; return; }
    sendTo(p,{t:"state",s,q:p.question});
  });
  saveHost(); render();
}
function hostHandle(connId,pid,msg){
  if(!H||!msg) return;
  if(msg.t==="join"){ hostJoin(connId,msg.pid,msg.name); return; }
  const p=hp(pid); if(!p) return;
  p.lastSeen=Date.now();
  if(msg.t==="ping"){                       // Herzschlag: zurueck aus kurzer Stille
    if(!p.online){ p.online=true; p.quick=false; p.offSince=0; if(connId) p.connId=connId; broadcast(); }
    return;
  }
  switch(msg.t){
    case "answer":
      if(H.phase!=="answer"||p.waiting) return;
      p.answer=String(msg.text||"").trim().slice(0,80)||"—";
      checkAnswers(); broadcast(); return;
    case "vote":
      if(H.phase!=="vote"||p.waiting||msg.target===pid||!hp(msg.target)) return;
      p.vote=msg.target; checkVotes(); broadcast(); return;
    case "chat": hostChat(pid,msg.text); return;
    case "bye":                                   // Spieler verlaesst die Seite
      p.online=false; p.quick=true; p.offSince=Date.now();
      armGrace(QUICK+400); broadcast(); return;
    case "force":                                 // Host: ohne die Abwesenden weiter
      if(pid===myPid){ checkAnswers(true); checkVotes(true); broadcast(); } return;
    case "start":  if(pid===myPid&&H.phase==="lobby") hostStartRound(); return;
    case "tovote": if(pid===myPid&&H.phase==="reveal"){H.phase="vote";setDeadline("vote");broadcast();} return;
    case "next":   if(pid===myPid&&H.phase==="result") hostStartRound(); return;
    case "lobby":  if(pid===myPid){H.phase="lobby";H.deadline=0;broadcast();} return;
    case "kick":   if(pid===myPid&&H.phase==="lobby") hostKick(msg.pid); return;
    case "timer":                                 // Zeiten einstellen (nur Host, nur im Warteraum)
      if(pid===myPid&&H.phase==="lobby"&&typeof msg.sec==="number"&&msg.sec>=0&&msg.sec<=900){
        if(msg.which==="answer") H.tAnswer=msg.sec;
        else if(msg.which==="talk") H.tTalk=msg.sec;
        else if(msg.which==="vote") H.tVote=msg.sec;
        broadcast();
      }
      return;
    case "leave":                                 // Spieler verlaesst den Raum freiwillig
      H.players=H.players.filter(x=>x.pid!==pid);
      checkAnswers(); checkVotes(); broadcast(); return;
  }
}
function act(msg){
  if(isHost) hostHandle(null,myPid,msg);
  else if(hostConn&&hostConn.open){ try{hostConn.send(msg);}catch(_){} }
}

/* ============================ Verbindung ============================ */
function fail(m){ screen="error"; errMsg=m; render(); }

function startHost(name,resume){
  isHost=true; myName=name; screen="connecting"; render();
  claim(resume?resume.code:genCode(),resume?resume.state:null,0);
}
function claim(code,restore,attempt){
  const p=new Peer(PREFIX+code,{debug:0});
  let opened=false;
  p.on("open",()=>{
    opened=true; peer=p; roomCode=code;
    if(restore){
      H=restore; H.kicked=H.kicked||[]; H.chat=H.chat||[];
      H.tAnswer=H.tAnswer||0; H.tTalk=H.tTalk||0; H.tVote=H.tVote||0;
      const me=hp(myPid);
      if(me){ me.online=true; me.connId=null; myName=me.name; }
      else H.players.push({pid:myPid,name:myName,score:0,answer:null,vote:null,question:"",online:true,connId:null});
    }else{
      H=freshState();
      H.players.push({pid:myPid,name:myName,score:0,answer:null,vote:null,question:"",online:true,connId:null});
    }
    screen="game"; banner=""; broadcast();
    clearInterval(sweepTimer); sweepTimer=setInterval(hostSweep,2000);
  });
  p.on("connection",c=>{
    let pid=null;
    c.on("open",()=>{ conns[c.peer]=c; });
    c.on("data",d=>{
      conns[c.peer]=c;
      if(d&&d.t==="join") pid=d.pid;
      hostHandle(c.peer,pid,d);
    });
    c.on("close",()=>hostOffline(c.peer));
    c.on("error",()=>{});
  });
  p.on("error",e=>{
    if(opened) return;
    if(e.type==="unavailable-id"&&attempt<6){
      try{p.destroy();}catch(_){}
      setTimeout(()=>claim(restore?code:genCode(),restore,attempt+1),restore?1800:120);
      return;
    }
    fail(peerErr(e));
  });
  p.on("disconnected",()=>{ try{p.reconnect();}catch(_){} });
}

function startClient(code,name){
  isHost=false; myName=name; roomCode=code; screen="connecting"; render();
  LS.set("fi_room",{code,name,ts:Date.now(),owner:myPid});
  const p=new Peer({debug:0});
  peer=p;
  p.on("open",()=>connectHost());
  p.on("error",e=>{
    if(e.type==="peer-unavailable"){ scheduleRetry(); return; }
    if(screen==="connecting"&&retries===0) fail(peerErr(e)); else scheduleRetry();
  });
  p.on("disconnected",()=>{ try{p.reconnect();}catch(_){} });
}
function connectHost(){
  if(!peer||peer.destroyed) return;
  let c;
  try{ c=peer.connect(PREFIX+roomCode,{reliable:true}); }catch(_){ scheduleRetry(); return; }
  hostConn=c;
  const guard=setTimeout(()=>{ if(!c.open) scheduleRetry(); },9000);
  c.on("open",()=>{
    clearTimeout(guard); retries=0; banner=""; lastHb=Date.now();
    screen="game"; c.send({t:"join",pid:myPid,name:myName}); render();
  });
  c.on("data",d=>{
    if(!d) return;
    lastHb=Date.now();
    if(d.t==="hb"){ if(banner){ banner=""; render(); } return; }
    if(d.t==="state"){ S=d.s; myQuestion=d.q||""; screen="game"; banner=""; render(); }
    else if(d.t==="kick"||d.t==="denied"){ LS.delMine("fi_room"); screen="kicked"; teardown(); render(); }
  });
  c.on("close",()=>{ clearTimeout(guard); scheduleRetry(); });
  c.on("error",()=>{ clearTimeout(guard); scheduleRetry(); });
}
function scheduleRetry(){
  if(screen==="kicked"||isHost) return;
  if(retryTimer) return;
  retries++;
  if(retries>40){ fail("Der Host ist nicht mehr erreichbar. Wahrscheinlich hat er die Seite geschlossen."); return; }
  banner="Verbindung unterbrochen – versuche erneut…";
  if(!S) screen="connecting";
  render();
  retryTimer=setTimeout(()=>{ retryTimer=null; connectHost(); },2000);
}
let lastHb=Date.now();
setInterval(()=>{                                   // Client meldet sich beim Host
  if(isHost||!hostConn||!hostConn.open) return;
  try{ hostConn.send({t:"ping"}); }catch(_){}
},BEAT);
setInterval(()=>{                                   // Client merkt, wenn der Host verstummt
  if(isHost||screen!=="game"||retryTimer) return;
  if(Date.now()-lastHb>HOSTDEAD){ try{hostConn&&hostConn.close();}catch(_){} scheduleRetry(); }
},4000);
function teardown(){ try{peer&&peer.destroy();}catch(_){} peer=null;hostConn=null; }
function peerErr(e){
  if(e.type==="peer-unavailable") return "Diesen Raum gibt es nicht (mehr).";
  if(e.type==="network"||e.type==="server-error") return "Keine Verbindung zum Vermittlungsserver. Internet prüfen und neu laden.";
  if(e.type==="browser-incompatible") return "Dieser Browser unterstützt WebRTC leider nicht.";
  return "Verbindungsfehler: "+(e.type||e.message||"unbekannt");
}

/* ============================ Rendering ============================ */
/* ---------- Uhr ---------- */
const secLabel=v=>v<60?v+" Sek":(v/60)+" Min";
const fmtTime=sec=>Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
const timeLeft=()=>(S&&S.deadline)?Math.max(0,Math.round((S.deadline-Date.now())/1000)):null;
setInterval(()=>{
  const t=timeLeft(); if(t===null) return;
  const hot=t<=15;
  document.querySelectorAll(".clockv").forEach(n=>{
    n.textContent=fmtTime(t); n.classList.toggle("hot",hot);
  });
},500);

/* ---------- Ton ---------- */
let soundOn=LS.get("fi_sound",true), ac=null;
function beep(kind){
  if(!soundOn) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ac=ac||new AC(); if(ac.state==="suspended") ac.resume();
    const t=ac.currentTime;
    const noten = kind==="chat"?[[880,0]]
               : kind==="soft"?[[523,0],[698,.12]]
               : [[659,0],[988,.14],[1319,.28]];      // Aufruf: dreitoenig, faellt auf
    noten.forEach(([f,d])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+d);
      g.gain.exponentialRampToValueAtTime(kind==="chat"?.12:.2,t+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+d+.32);
      o.connect(g); g.connect(ac.destination);
      o.start(t+d); o.stop(t+d+.34);
    });
  }catch(_){}
}

/* ---------- Benachrichtigungen ---------- */
const TITLE="Fragen-Impostor";
let lastPhase=null,lastRound=0,lastChat=0,notifyOn=LS.get("fi_notify",false);
const canNotify=()=>typeof Notification!=="undefined";

/* Was gerade zu tun ist – steht immer im Tab-Titel. */
function stateTitle(){
  if(!S) return TITLE;
  const me=S.players.find(p=>p.pid===myPid);
  if(me&&me.waiting) return "Warten auf die nächste Runde";
  if(S.phase==="answer") return me&&me.answered?"Warten auf die anderen":"⏳ Jetzt antworten!";
  if(S.phase==="reveal") return "💬 Auflösung – jetzt diskutieren";
  if(S.phase==="vote")   return me&&me.voted?"Warten auf die anderen":"🗳️ Jetzt abstimmen!";
  if(S.phase==="result") return "🏆 Ergebnis";
  return "Warteraum";
}
function updateTitle(){
  const unread=document.hidden?Math.max(0,(S?(S.chat||[]).length:0)-chatSeen):0;
  document.title=(unread?"("+unread+") ":"")+stateTitle()+" · "+TITLE;
}
function notify(short,body,sound){
  beep(sound||"alert");
  if(document.hidden&&notifyOn&&canNotify()&&Notification.permission==="granted"){
    try{ new Notification(TITLE,{body:body||short,tag:"fragen-impostor",renotify:true}); }catch(_){}
  }
}
document.addEventListener("visibilitychange",updateTitle);
function askNotify(){
  if(!canNotify()) return;
  Notification.requestPermission().then(r=>{
    notifyOn=(r==="granted"); LS.set("fi_notify",notifyOn); render();
  });
}
/* Vergleicht den neuen Zustand mit dem letzten und meldet, was passiert ist. */
function announce(){
  if(!S) return;
  const chat=(S.chat||[]).length;
  if(lastPhase!==null&&chat>lastChat){
    const m=S.chat[chat-1];
    if(m&&m.pid!==myPid){
      if(document.hidden||!chatOpen) notify("Neue Nachricht",m.name+": "+m.text,"chat");
    }
  }
  lastChat=chat;
  if(S.phase!==lastPhase||S.round!==lastRound){
    if(lastPhase!==null){
      if(S.phase==="answer")      notify("Deine Frage ist da","Runde "+S.round+" läuft – jetzt antworten.","alert");
      else if(S.phase==="reveal") notify("Auflösung","Alle Antworten sind da.","soft");
      else if(S.phase==="vote")   notify("Abstimmung","Wer ist der Lügner?","alert");
      else if(S.phase==="result") notify("Ergebnis steht fest","","soft");
      else if(S.phase==="lobby")  notify("Zurück im Warteraum","","soft");
    }
    lastPhase=S.phase; lastRound=S.round;
  }
  updateTitle();
}

const HEAD=`<div class="brand"><span class="mark">🕵️</span><h1>Fragen-<em>Impostor</em></h1></div>`;

function paint(html){
  refocus=(document.activeElement&&["ai","ci","nm","cd"].includes(document.activeElement.id))
    ?document.activeElement.id:null;
  app.innerHTML=(banner?`<div class="warn">${esc(banner)}</div>`:"")+html;
  const ai=el("ai"); if(ai){ ai.value=draftAnswer; ai.oninput=()=>draftAnswer=ai.value; }
  const ci=el("ci"); if(ci){ ci.value=draftChat;  ci.oninput=()=>draftChat=ci.value; }
  const log=el("clog"); if(log) log.scrollTop=log.scrollHeight;
  if(refocus&&el(refocus)){ const f=el(refocus); f.focus(); try{f.setSelectionRange(f.value.length,f.value.length);}catch(_){} }
}
function render(){
  if(screen==="start")      return viewStart();
  if(screen==="invite")     return viewInvite();
  if(screen==="connecting") return viewWait();
  if(screen==="error")      return viewError();
  if(screen==="kicked")     return viewKicked();
  if(!S) return viewWait();
  announce();
  if(chatOpen) chatSeen=(S.chat||[]).length;
  const me=S.players.find(p=>p.pid===myPid);
  if(me&&me.waiting&&S.phase!=="lobby") return viewWaiting();   // Nachzuegler: nur warten
  if(S.phase==="lobby")  return viewLobby();
  if(S.phase==="answer") return viewAnswer(me);
  if(S.phase==="reveal") return viewReveal(me);
  if(S.phase==="vote")   return viewVote(me);
  if(S.phase==="result") return viewResult(me);
}

/* ---------- Startbildschirme ---------- */
function viewStart(){
  const saved=LS.get("fi_host",null), room=LS.get("fi_room",null);
  const fresh=o=>o&&Date.now()-o.ts<MAXAGE&&(!o.owner||o.owner===myPid);
  paint(`<div class="solo">`+HEAD+
  `<p class="sub">Alle beantworten dieselbe Frage – nur einer bekommt eine andere. Findet heraus, wer lügt.</p>`+
  (fresh(saved)?`<div class="card glow rise"><h2>Raum ${esc(saved.code)} fortsetzen</h2>
     <div class="note" style="margin-top:0">Dein letzter Raum läuft noch – Punkte und Spieler bleiben erhalten.</div>
     <button id="res">Raum ${esc(saved.code)} wieder öffnen</button>
     <button id="resx" class="sec">Verwerfen</button></div>`:"")+
  (!fresh(saved)&&fresh(room)?`<div class="card glow rise"><h2>Zurück zu Raum ${esc(room.code)}</h2>
     <div class="note" style="margin-top:0">Du warst als <b>${esc(room.name)}</b> dabei.</div>
     <button id="back">Wieder beitreten</button>
     <button id="backx" class="sec">Verwerfen</button></div>`:"")+
  `<div class="card rise"><label for="nm">Dein Name</label>
     <input id="nm" maxlength="16" placeholder="z.B. Alex" autocomplete="nickname">
     <button id="mk">Neuen Raum erstellen</button></div>
   <div class="card rise"><label for="cd">Raum-Code</label>
     <input id="cd" class="code" maxlength="4" placeholder="XXXX" autocomplete="off" autocapitalize="characters">
     <button id="jn" class="sec">Raum beitreten</button></div>
   <div class="foot">Läuft direkt zwischen euren Geräten.<br>Kein Konto, keine Daten auf einem Server.</div></div>`);
  const nm=el("nm"),cd=el("cd");
  nm.value=LS.get("fi_name","")||"";
  const name=()=>{ const n=(nm.value.trim()||"Spieler").slice(0,16); LS.set("fi_name",nm.value.trim()); return n; };
  el("mk").onclick=()=>{ LS.delMine("fi_host"); LS.delMine("fi_room"); startHost(name()); };
  el("jn").onclick=()=>{ const c=cd.value.trim().toUpperCase(); if(c.length<4){cd.focus();return;} LS.delMine("fi_host"); startClient(c,name()); };
  cd.oninput=()=>cd.value=cd.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  cd.onkeydown=e=>{ if(e.key==="Enter") el("jn").click(); };
  nm.onkeydown=e=>{ if(e.key==="Enter") el("mk").click(); };
  if(el("res"))  el("res").onclick=()=>startHost(LS.get("fi_name","Host"),saved);
  if(el("resx")) el("resx").onclick=()=>{ LS.delMine("fi_host"); render(); };
  if(el("back")) el("back").onclick=()=>startClient(room.code,room.name);
  if(el("backx"))el("backx").onclick=()=>{ LS.delMine("fi_room"); render(); };
}

/* ---------- Spielbildschirme ---------- */
function topbar(){
  const unread=Math.max(0,(S.chat||[]).length-chatSeen);
  const steps=["answer","reveal","vote","result"];
  const idx=steps.indexOf(S.phase);
  return `<div class="chips">
    <span class="chip">Raum <b>${esc(S.code)}</b></span>
    ${S.round?`<span class="chip">Runde ${S.round}</span>`:""}
    <span class="chip">${S.players.filter(p=>p.online).length} online</span>
    <span class="chip btn only-mobile" id="plbtn">Spieler (${S.players.length})</span>
    <span class="chip btn" id="sndbtn" title="Ton an- oder ausschalten">${soundOn?"🔊 Ton an":"🔇 Ton aus"}</span>
    ${S.deadline?`<span class="chip clock"><span class="clockv">${fmtTime(timeLeft()||0)}</span></span>`:""}
    <span class="chip btn ${unread?"act":""}" id="chattop">Chat${unread?` <span class="bdg">${unread}</span>`:""}</span>
    <span class="chip btn danger" id="${isHost?"closeroom":"leave"}">${isHost?"Raum schließen":"Raum verlassen"}</span>
  </div>`+(idx>=0?`<div class="steps">${steps.map((x,i)=>`<div class="step ${i<=idx?"on":""}"></div>`).join("")}</div>`:"");
}
function frame(main,players,chat){
  return topbar()+`<div class="wrap">
    <div class="main">${main}</div>
    <aside class="colA">${players?`<button class="closex" id="pclose">Schließen</button>${players}`:""}</aside>
    <aside class="colB">${chat||""}</aside>
  </div><div class="scrim" id="scrim"></div>`;
}
function wire(){
  const shut=()=>document.body.classList.remove("pl-open");
  const pb=el("plbtn"); if(pb) pb.onclick=()=>document.body.classList.toggle("pl-open");
  const sb=el("sndbtn"); if(sb) sb.onclick=()=>{ soundOn=!soundOn; LS.set("fi_sound",soundOn); if(soundOn) beep("soft"); render(); };
  const sc=el("scrim"); if(sc) sc.onclick=shut;
  const pc=el("pclose"); if(pc) pc.onclick=shut;
  const ct=el("chattop");
  if(ct) ct.onclick=()=>{ chatOpen=true; LS.set("fi_chatopen",true); render();
    setTimeout(()=>{ const c=el("chatcard"); if(c) c.scrollIntoView({behavior:"smooth",block:"end"}); },60); };
  const th=el("chathead");
  if(th) th.onclick=()=>{ chatOpen=!chatOpen; LS.set("fi_chatopen",chatOpen); render(); };
  wireExit();
  const cs=el("csend"), ci=el("ci");
  if(cs&&ci){
    const send=()=>{ const v=ci.value.trim(); if(!v) return; draftChat=""; ci.value=""; act({t:"chat",text:v}); ci.focus(); };
    cs.onclick=send; ci.onkeydown=e=>{ if(e.key==="Enter") send(); };
  }
  const f=el("force"); if(f) f.onclick=()=>act({t:"force"});
}
function chatCard(){
  const msgs=S.chat||[], unread=Math.max(0,msgs.length-chatSeen);
  if(!chatOpen) return `<div class="card tight rise" id="chatcard">
    <div id="chathead" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:15px">Chat</b>
      <span class="pts">${unread?`<span class="bdg" style="background:var(--p);color:#fff;padding:1px 7px;border-radius:99px">${unread} neu</span>`:`${msgs.length} Nachrichten · öffnen`}</span>
    </div></div>`;
  return `<div class="card rise chatfull" id="chatcard">
    <div id="chathead" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <b style="font-size:15px">Chat</b><span class="pts">zuklappen</span></div>
    <div class="chat-log" id="clog">${
      msgs.length?msgs.map(m=>`<div class="msg ${m.pid===myPid?"me":""}">
        ${avatar({pid:m.pid,name:m.name})}
        <div class="bub"><div class="au">${esc(m.name)}</div><div class="tx">${esc(m.text)}</div></div></div>`).join("")
      :`<div class="chat-empty">Noch nichts geschrieben.</div>`}</div>
    <div class="chat-in" style="flex:none"><input id="ci" maxlength="300" placeholder="Nachricht…" autocomplete="off" enterkeyhint="send">
      <button id="csend">→</button></div></div>`;
}
/* Spielerliste – je nach Phase mit Punkten, Status oder Kick-Knopf. */
function playersCard(mode){
  const list=mode==="lobby"?S.players:S.players.filter(p=>!p.waiting);
  const rows=mode==="score"?[...list].sort((x,y)=>y.score-x.score):list;
  const best=rows.length?Math.max(...rows.map(p=>p.score)):0;
  const status=p=>{
    if(!p.online) return `<span class="pts off">weg</span>`;
    if(mode==="answer") return `<span class="pts ${p.answered?"ok":""}">${p.answered?"fertig":"tippt…"}</span>`;
    if(mode==="vote")   return `<span class="pts ${p.voted?"ok":""}">${p.voted?"gewählt":"überlegt…"}</span>`;
    return `<span class="pts">${p.score} Pkt</span>`;
  };
  return `<div class="card rise">
    <h2>${mode==="score"?"Punkte":"Spieler"} (${rows.length})</h2>
    <ul class="plist">${rows.map(p=>`<li>${avatar(p)}
      <span class="nm">${esc(p.name)}${p.pid===myPid?'<span class="tag you">du</span>':""}${p.pid===S.hostId?'<span class="tag host">Host</span>':""}${mode==="score"&&p.score===best&&best>0?'<span class="tag win">vorn</span>':""}
      ${p.online?"":"<small>nicht verbunden</small>"}</span>
      ${status(p)}
      ${mode==="lobby"&&isHost&&p.pid!==myPid?`<button class="mini" data-kick="${esc(p.pid)}">Kick</button>`:""}</li>`).join("")}</ul>
    ${mode==="score"?`<div class="note">Erwischt die Mehrheit den Lügner, bekommt das ganze Team +1. Kommt er durch, bekommt er allein +1.</div>`:""}
  </div>`;
}
/* Ausstieg – in jeder Phase sichtbar. Der Host schliesst den Raum, alle anderen gehen. */
/* Der Ausstieg sitzt oben in der Kopfleiste (rot) – unten daher nichts mehr. */
function exitBtn(){ return ""; }
function wireExit(){
  const b=el("leave");
  if(b) b.onclick=()=>{
    if(!confirm("Raum wirklich verlassen? Deine Punkte in diesem Raum sind dann weg.")) return;
    act({t:"leave"}); LS.delMine("fi_room");
    setTimeout(()=>{ teardown(); location.replace(location.pathname); },250);
  };
  const c=el("closeroom");
  if(c) c.onclick=()=>{
    if(!confirm("Raum wirklich schließen? Alle Mitspieler fliegen raus.")) return;
    LS.delMine("fi_host"); teardown(); location.replace(location.pathname);
  };
}
/* Host-Knopf: weiter, ohne auf Abwesende zu warten. */
function forceBtn(kind){
  if(!isHost) return "";
  const inR=S.players.filter(p=>!p.waiting);
  const gone=inR.filter(p=>!p.online);
  if(!gone.length) return "";
  const done=inR.filter(p=>p.online).every(p=>kind==="answer"?p.answered:p.voted);
  if(!done) return "";
  return `<button id="force" class="sec">Ohne ${gone.length===1?esc(gone[0].name):gone.length+" Abwesende"} weitermachen</button>`;
}

function viewLobby(){
  const link=location.origin+location.pathname+"?r="+S.code;
  const on=S.players.filter(p=>p.online).length;
  paint(HEAD+frame(
    `<div class="card glow code-hero rise"><div class="lbl">Raum-Code</div><div class="val">${esc(S.code)}</div>
       <button id="cp" class="sec">Einladungslink kopieren</button></div>
     ${on<3?`<div class="card rise note" style="margin-top:0">Es fehlen noch ${3-on} Spieler – ab 3 geht es los.</div>`:""}
     <div class="card rise"><h2>Zeitlimits</h2>
       ${isHost?["answer","talk","vote"].map(k=>{
         const titel={answer:"Antwortzeit",talk:"Besprechungszeit",vote:"Zeit zum Abstimmen"}[k];
         const wert={answer:S.tAnswer,talk:S.tTalk,vote:S.tVote}[k];
         const opt={answer:[0,60,180,300],talk:[0,60,120,180],vote:[0,30,60,120]}[k];
         return `<label style="margin-top:14px">${titel}</label>
           <div class="seg">${opt.map(v=>`<button data-t="${k}" data-sec="${v}" class="${wert===v?"on":""}">${v?secLabel(v):"ohne"}</button>`).join("")}</div>`;
       }).join("")
       :[["Antwortzeit",S.tAnswer],["Besprechungszeit",S.tTalk],["Abstimmung",S.tVote]].map(([t,v])=>
          `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)">
             <span class="pts">${t}</span><b>${v?secLabel(v):"ohne Limit"}</b></div>`).join("")}
       <div class="note">${isHost?"Läuft eine Zeit ab, geht es automatisch weiter.":"Der Host stellt die Zeiten ein."}</div>
     </div>
     <div class="card rise"><label>Ton</label>
       <div class="note" style="margin-top:0">Ein kurzes Signal, sobald du dran bist. Gilt nur für dich.</div>
       <button id="sndbig" class="sec">${soundOn?"🔊 Ton ist an – ausschalten":"🔇 Ton ist aus – einschalten"}</button>
     </div>
     ${(canNotify()&&!notifyOn&&Notification.permission!=="denied")?`<div class="card rise"><label>Benachrichtigungen</label>
        <div class="note" style="margin-top:0">Damit du es mitbekommst, wenn eine neue Runde startet – auch wenn der Tab im Hintergrund ist.</div>
        <button id="notif" class="sec">Benachrichtigungen einschalten</button></div>`:""}
     ${isHost?`<button id="go" ${on<3?"disabled":""}>Runde starten</button>`
             :`<div class="card center note rise">Warte auf den Host…</div>`}
     ${exitBtn()}`,
    playersCard("lobby"),chatCard()));
  wire();
  el("cp").onclick=async e=>{
    try{ await navigator.clipboard.writeText(link); e.target.textContent="Link kopiert ✓"; }
    catch(_){ prompt("Link zum Teilen:",link); }
  };
  if(el("notif")) el("notif").onclick=askNotify;
  app.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>act({t:"timer",which:b.dataset.t,sec:+b.dataset.sec}));
  if(el("sndbig")) el("sndbig").onclick=()=>{ soundOn=!soundOn; LS.set("fi_sound",soundOn); if(soundOn) beep("soft"); render(); };
  if(isHost){
    if(el("go")) el("go").onclick=()=>act({t:"start"});
    app.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{
      if(confirm("Diesen Spieler entfernen?")) act({t:"kick",pid:b.dataset.kick});
    });

}
/* Nachzügler sehen nur einen Wartebildschirm – nichts aus der laufenden Runde. */

       <div class="note">Du bist im Raum <b>${esc(S.code)}</b>. Die anderen sind noch mitten in Runde ${S.round} –

function viewAnswer(me){
  const done=me&&me.answered;
  paint(HEAD+frame(
    `<div class="card qhero rise"><div class="qlbl">Deine Frage</div><div class="q">${esc(myQuestion)}</div></div>`+
    (S.deadline?`<div class="card center rise" style="padding:20px">
        <div class="qlbl" style="margin-bottom:4px">Noch Zeit</div>
        <div class="bigclock clockv">${fmtTime(timeLeft()||0)}</div></div>`:"")+
    (done?`<div class="card center rise"><span class="spin"></span>Warte auf die anderen…</div>${forceBtn("answer")}`
         :`<div class="card rise"><label for="ai">Deine Antwort – kurz halten</label>
             <input id="ai" maxlength="80" placeholder="Antwort…" autocomplete="off" enterkeyhint="send">
             <button id="sb">Antwort abschicken</button>
             <div class="hint">Zeig dein Handy niemandem – nicht jeder hat dieselbe Frage.</div></div>`)
    +exitBtn(),
    playersCard("answer"),chatCard()));
  wire();
  if(!done){
    const ai=el("ai"); ai.focus();
    const send=()=>{ const v=ai.value.trim(); if(!v) return; draftAnswer=""; act({t:"answer",text:v}); };
    el("sb").onclick=send; ai.onkeydown=e=>{ if(e.key==="Enter") send(); };
  }
}
function viewReveal(){
  const inR=S.players.filter(p=>!p.waiting);
  paint(HEAD+frame(
    (S.deadline?`<div class="card center rise" style="padding:16px"><div class="qlbl" style="margin-bottom:3px">Besprechungszeit</div>
       <div class="bigclock clockv" style="font-size:30px">${fmtTime(timeLeft()||0)}</div></div>`:"")+
    `<div class="card qhero rise"><div class="qlbl">Die Hauptfrage war</div><div class="q">${esc(S.mainQuestion)}</div></div>

       ${inR.map(p=>`<div class="ans">${avatar(p)}<div><div class="who">${esc(p.name)}${p.pid===myPid?" · du":""}</div>

       <div class="hint">Jetzt laut diskutieren: Wessen Antwort passt nicht zur Frage?</div></div>

function viewVote(me){
  const voted=me&&me.voted;
  const others=S.players.filter(p=>!p.waiting&&p.pid!==myPid);
  paint(HEAD+frame(
    (S.deadline?`<div class="card center rise" style="padding:16px"><div class="qlbl" style="margin-bottom:3px">Noch Zeit zum Abstimmen</div>
       <div class="bigclock clockv" style="font-size:30px">${fmtTime(timeLeft()||0)}</div></div>`:"")+
    `<div class="card qhero rise"><div class="qlbl">Hauptfrage</div><div class="q">${esc(S.mainQuestion)}</div></div>
     <div class="card rise"><h2>Wer hatte die andere Frage?</h2>
       ${voted?`<div class="center note" style="margin-top:0"><span class="spin"></span>Warte auf die anderen…</div>`
              :others.map(p=>`<button class="pick" data-v="${esc(p.pid)}">${avatar(p)}
                 <span class="nm">${esc(p.name)}<small>${esc(p.answer||"")}</small></span></button>`).join("")}
     </div>${voted?forceBtn("vote"):""}${exitBtn()}`,
    playersCard("vote"),chatCard()));
  wire();
  if(!voted) app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>act({t:"vote",target:b.dataset.v}));
}
function viewResult(){
  const imp=S.players.find(p=>p.pid===S.impostorId);
  const inR=S.players.filter(p=>!p.waiting);
  const me=S.players.find(p=>p.pid===myPid);
  const votesFor=pid=>inR.filter(p=>p.vote===pid).map(p=>p.name);

  /* Teamwertung: Die Gruppe gewinnt oder verliert gemeinsam.
     Ein einzelner richtiger Tipp zaehlt nicht, wenn die Mehrheit danebenliegt. */
  let verdict="";
  if(me&&!me.waiting){
    const bin=me.pid===S.impostorId;
    const won=bin?!S.caught:S.caught;
    const selbstRichtig=!bin&&me.vote===S.impostorId;
    const why=bin
      ?(won?"Niemand hat dich erwischt. +1 Punkt für dich."
           :"Die Mehrheit hat dich erwischt. Diese Runde geht an die anderen.")
      :(won?"Ihr habt den Lügner gemeinsam erwischt. +1 Punkt für jeden im Team."
           :(selbstRichtig?"Dein Tipp war richtig – aber die Mehrheit lag daneben. Keine Punkte."
                          :"Die Mehrheit lag daneben. Der Punkt geht an den Lügner."));
    verdict=`<div class="card ${won?"win":"lose"} center rise" style="padding:26px 20px">
      <div class="verdict ${won?"g":"r"}">${won?"Gewonnen":"Verloren"}</div>
      <div class="vsub">${bin?"Du warst der Lügner. ":""}${why}</div></div>`;
  }

  paint(HEAD+frame(
    verdict+
    `<div class="card glow rise">
       <div class="qlbl">Der Lügner war</div>
       <div class="big" style="margin:2px 0 14px">${esc(imp?imp.name:"—")}</div>
       <div class="qpair">
         <div class="qbox"><div class="k">Alle anderen bekamen</div><div class="v">${esc(S.mainQuestion)}</div></div>
         <div class="qbox imp"><div class="k">${esc(imp?imp.name:"Der Lügner")} bekam</div>
           <div class="v">${esc(S.impostorQuestion||"—")}</div></div>
       </div></div>
     <div class="card rise"><h2>Wer hat wen gewählt</h2>
       ${inR.map(p=>{
         const ziel=p.vote?S.players.find(x=>x.pid===p.vote):null;
         const richtig=ziel&&ziel.pid===S.impostorId;
         const bekommen=votesFor(p.pid).length;
         return `<div class="ans">${avatar(p)}
           <div style="flex:1;min-width:0">
             <div class="who">${esc(p.name)}${p.pid===S.impostorId?'<span class="tag imp">Lügner</span>':""}</div>
             <div class="txt" style="font-size:15.5px">${
               ziel?`<span style="color:var(--mut);font-weight:500">stimmte für</span> <span style="color:${richtig?"var(--ok)":"var(--tx)"}">${esc(ziel.name)}</span>${richtig?' <span style="color:var(--ok)">✓</span>':""}`
                   :`<span style="color:var(--mut);font-weight:500">hat nicht abgestimmt</span>`}</div>
           </div>
           ${bekommen?`<span class="pts">${bekommen} ${bekommen===1?"Stimme":"Stimmen"}</span>`:""}
         </div>`;
       }).join("")}</div>
     ${isHost?`<button id="nx">Nächste Runde</button><button id="lb" class="sec">Zurück in den Warteraum</button>`
             :`<div class="card center note rise">Der Host startet die nächste Runde.</div>`}
     ${exitBtn()}`,
    playersCard("score"),chatCard()));
  wire();
  if(isHost){ el("nx").onclick=()=>act({t:"next"}); el("lb").onclick=()=>act({t:"lobby"}); }
}

  try{ if(!isHost&&hostConn&&hostConn.open) hostConn.send({t:"bye"}); }catch(_){}
});
(function boot(){
  const savedHost=LS.get("fi_host",null), savedRoom=LS.get("fi_room",null);
  const fresh=o=>o&&Date.now()-o.ts<MAXAGE;
  const mine=o=>fresh(o)&&(!o.owner||o.owner===myPid);
  if(mine(savedHost)&&(!inviteCode||inviteCode===savedHost.code)){
    startHost(LS.get("fi_name","Host"),savedHost); return;      // Host lädt neu → Raum lebt weiter
  }
  if(inviteCode){
    if(mine(savedRoom)&&savedRoom.code===inviteCode){
      startClient(inviteCode,savedRoom.name); return;            // Link neu geladen → direkt zurück
    }
    const n=LS.get("fi_name","");
    if(n){ startClient(inviteCode,n); return; }
    screen="invite"; render(); return;
  }
  screen="start"; render();
})();
</script>
</body>
</html>
